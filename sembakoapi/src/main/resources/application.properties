spring.application.name=toko-berkah-api
server.port=8080

# SQLite lives next to the server module. Delete the file to reset the database.
spring.datasource.url=jdbc:sqlite:sembako.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-test-query=SELECT 1

# Keep Spring from looking for schema.sql/data.sql until the team adds them.
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
